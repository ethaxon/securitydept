[package]
name = "securitydept-oidc-client"
version = "0.3.1"
edition = "2024"

authors = ["Zhou Yeheng <root@aitiotekt.com>"]
description = "OIDC Client of SecurityDept, a layered authentication and authorization toolkit built as reusable Rust crates."
license = "MIT"
repository = "https://github.com/ethaxon/securitydept"
homepage = "https://securitydept.ethaxon.com/"
documentation = "https://docs.rs/securitydept-oidc-client"
readme = "README.md"
keywords = ["auth","oauth","oidc","security","token"]
categories = ["authentication","network-programming","web-programming"]
[features]
config-schema = [
    "dep:schemars",
    "securitydept-utils/config-schema",
    "securitydept-oauth-provider/config-schema",
    "serde_with/schemars_1",
]
recommend = ["claims-script", "recommend-pending-store"]
claims-script = ["dep:boa_engine", "dep:swc_core"]
recommend-pending-store = ["moka-pending-store"]
moka-pending-store = ["dep:moka"]

[dependencies]
securitydept-oauth-provider = { version = "~0.3.1", path = "../oauth-provider" }
securitydept-utils = { version = "~0.3.1", path = "../utils" }
openidconnect = { workspace = true }
oauth2-reqwest = { workspace = true }
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
serde_with = { workspace = true }
schemars = { workspace = true, optional = true }
http = { workspace = true }
base64 = { workspace = true }
boa_engine = { version = "0.21", optional = true }
chrono = { workspace = true }
swc_core = { version = "75", features = [
    "__parser",
    "common",
    "ecma_ast",
    "ecma_codegen",
    "ecma_parser_typescript",
    "ecma_transforms",
    "ecma_transforms_typescript",
    "ecma_visit",
], optional = true }
serde-constant = { workspace = true }
humantime-serde = { workspace = true }
moka = { workspace = true, features = ["future"], optional = true }

[dev-dependencies]
axum = { workspace = true }
jsonwebtoken = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["moka-pending-store"]
