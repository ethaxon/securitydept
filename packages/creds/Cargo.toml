[package]
name = "securitydept-creds"
version = "0.3.0-beta.9"
edition = "2024"

authors = ["Zhou Yeheng <root@aitiotekt.com>"]
description = "Credentials of SecurityDept, a layered authentication and authorization toolkit built as reusable Rust crates."
license = "MIT"
repository = "https://github.com/ethaxon/securitydept"
homepage = "https://securitydept.ethaxon.com/"
documentation = "https://docs.rs/securitydept-creds"
readme = "README.md"
keywords = ["auth","oauth","oidc","security","token"]
categories = ["authentication","network-programming","web-programming"]
[features]
jwk = []
oidc = ["dep:openidconnect"]
jwt = ["dep:jsonwebtoken", "jwk"]
jwe = [
    "jwt",
    "jwk",
    "dep:no-way-jose-core",
    "dep:no-way-jose-aes-cbc-hs",
    "dep:no-way-jose-aes-gcm",
    "dep:no-way-jose-aes-gcm-kw",
    "dep:no-way-jose-aes-kw",
    "dep:no-way-jose-ecdh-es",
    "dep:no-way-jose-pbes2",
    "dep:no-way-jose-rsa",
]
rfc9068 = ["jwt", "jwk"]

[dependencies]
securitydept-utils = { version = "~0.3.0-beta.9", path = "../utils" }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde_with = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
no-way-jose-core = { workspace = true, optional = true }
no-way-jose-aes-cbc-hs = { workspace = true, optional = true }
no-way-jose-aes-gcm = { workspace = true, optional = true }
no-way-jose-aes-gcm-kw = { workspace = true, optional = true }
no-way-jose-aes-kw = { workspace = true, optional = true }
no-way-jose-ecdh-es = { workspace = true, optional = true }
no-way-jose-pbes2 = { workspace = true, optional = true }
no-way-jose-rsa = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }
